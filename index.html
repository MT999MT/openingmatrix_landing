<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpeningMatrix - Coming Soon</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050b11;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .roadmap-page {
            width: min(650px, 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .roadmap-header {
            margin-bottom: 40px;
        }

        .roadmap-header .eyebrow {
            display: inline-block;
            margin-bottom: 12px;
            font-size: 0.75rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #9fefff;
            opacity: 0.9;
            font-weight: 600;
        }

        .roadmap-header h1 {
            margin: 0;
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            letter-spacing: -0.05em;
            color: #f3fbff;
            font-weight: 800;
        }

        .roadmap-header p {
            margin: 16px auto 0;
            max-width: 500px;
            color: #a6bfd0;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        /* --- Email Signup Section --- */
        .signup-container {
            background: linear-gradient(135deg, rgba(16, 28, 41, 0.7), rgba(7, 12, 18, 0.9));
            border: 1px solid rgba(159, 239, 255, 0.25);
            border-radius: 22px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .signup-text {
            text-align: center;
        }

        .signup-text h3 {
            margin: 0 0 6px 0;
            color: #f6fbff;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
        }

        .signup-text p {
            margin: 0;
            color: #a6bfd0;
            font-size: 0.95rem;
        }

        .signup-form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
        }

        .signup-form input[type="email"] {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(124, 176, 255, 0.2);
            background: rgba(5, 11, 17, 0.8);
            color: #f3fbff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .signup-form input[type="email"]:focus {
            border-color: #9fefff;
        }

        .signup-form button {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: #9fefff;
            color: #050b11;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .signup-form button:hover {
            opacity: 0.9;
        }

        @media (max-width: 500px) {
            .signup-form {
                flex-direction: column;
            }
            .signup-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<main class="roadmap-page">
    <section class="roadmap-header">
        <span class="eyebrow">Coming Soon</span>
        <h1>OpeningMatrix</h1>
        <p>
            A powerful new platform is currently under construction. We are fine-tuning the systems for launch.
        </p>
    </section>

    <section class="signup-container">
        <div class="signup-text">
            <h3>Get early access</h3>
            <p>Drop your email to get notified the second we launch beta testing.</p>
        </div>
        <form class="signup-form" action="#" method="POST">
            <input type="email" name="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>
    </section>
</main>

</body>
</html>
